<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Atlas Native: client I/O is striped and erasure coded across nodes while Raft groups keep metadata consistent">
<!-- Copyright (c) 2026 ZyvorAI Labs Private Limited. SPDX-License-Identifier: Apache-2.0 -->
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06121c"/><stop offset="1" stop-color="#0b1f2e"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f5f5f7;text-anchor:middle}.s{font-size:12px;fill:#9fb3c0}.h{font-size:15px;font-weight:600}.t{font-size:20px;font-weight:650;text-anchor:start}.l{text-anchor:start}</style></defs>
<rect width="960" height="360" rx="20" fill="url(#bg)"/>
<text x="40" y="44" class="t">Atlas Native data path</text>
<text x="40" y="66" class="s l">Striped, checksummed extents. Sharded Raft metadata. NFS, SMB, S3 and CSI over the same files.</text>
<g fill="#0e2a3b" stroke="#1f4a63"><rect x="40" y="130" width="170" height="110" rx="14"/>
<rect x="330" y="96" width="120" height="50" rx="12"/><rect x="330" y="160" width="120" height="50" rx="12"/><rect x="330" y="224" width="120" height="50" rx="12"/>
<rect x="560" y="96" width="120" height="50" rx="12"/><rect x="560" y="160" width="120" height="50" rx="12"/><rect x="560" y="224" width="120" height="50" rx="12"/>
<rect x="780" y="130" width="140" height="110" rx="14" stroke="#2ec4b6" stroke-width="2"/></g>
<g><text x="125" y="176" class="h">Clients</text><text x="125" y="198" class="s">NFS · SMB · S3 · FUSE · CSI</text>
<text x="390" y="126" class="h">node 1</text><text x="390" y="190" class="h">node 2</text><text x="390" y="254" class="h">node 3</text>
<text x="620" y="126" class="h">node 4</text><text x="620" y="190" class="h">node 5</text><text x="620" y="254" class="h">node 6</text>
<text x="850" y="176" class="h" style="fill:#2ec4b6">S3 tier</text><text x="850" y="198" class="s">cold extents</text></g>
<g fill="none" stroke="#2c5a75" stroke-width="2" stroke-dasharray="4 6"><path d="M210 185 C270 185 280 121 330 121"/><path d="M210 185 H330"/><path d="M210 185 C270 185 280 249 330 249"/>
<path d="M450 121 H560"/><path d="M450 185 H560"/><path d="M450 249 H560"/><path d="M680 185 H780" stroke="#2ec4b6"/></g>
<g filter="url(#glow)"><circle r="5" fill="#f5f5f7"><animateMotion dur="2.4s" repeatCount="indefinite" path="M210 185 C270 185 280 121 330 121 H560"/></circle>
<circle r="5" fill="#f5f5f7"><animateMotion dur="2.4s" begin=".5s" repeatCount="indefinite" path="M210 185 H560"/></circle>
<circle r="5" fill="#0a84ff"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite" path="M210 185 C270 185 280 249 330 249 H560"/></circle>
<circle r="5" fill="#2ec4b6"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M680 185 H780"/></circle></g>
<circle cx="390" cy="185" r="7" fill="none" stroke="#0a84ff" stroke-width="2"><animate attributeName="r" values="7;22" dur="2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".9;0" dur="2s" repeatCount="indefinite"/></circle>
<text x="40" y="338" class="s l">The pulse marks a Raft leader. 3 replicas by default or Reed-Solomon k+m, with a rebuild controller.</text>
</svg>
