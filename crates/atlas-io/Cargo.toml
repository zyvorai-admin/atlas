[package]
name = "atlas-io"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Observe-first eBPF storage I/O sensor for Atlas (bio latency, attribution, leased freeze)"

[[bin]]
name = "atlas-io-agent"
path = "src/bin/atlas-io-agent.rs"

[features]
# Live block-layer attach: build.rs compiles bpf/atlas_bio.bpf.c (needs clang + libbpf headers)
# and src/bpf.rs loads it with aya. Off by default so CI and `make run` need no BPF toolchain.
bpf = ["dep:aya"]

[dependencies]
atlas-api-types = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
aya = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
