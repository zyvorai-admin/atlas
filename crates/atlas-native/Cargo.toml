[package]
name = "atlas-native"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "atlas-native-node"
path = "src/bin/atlas-native-node.rs"

[features]
# io_uring + O_DIRECT device backend for data nodes (Linux only).
io-uring = ["dep:io-uring"]
# Tier cold extents to an S3-compatible bucket (Ceph RGW, MinIO, ...) through atlas-driver-rgw.
s3 = ["dep:atlas-driver-rgw", "dep:tokio", "dep:anyhow"]

[dependencies]
anyhow = { workspace = true, optional = true }
atlas-driver-rgw = { workspace = true, optional = true }
libc = "0.2"
redb = "4"
reed-solomon-simd = "3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
uuid.workspace = true
ring.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

[dev-dependencies]
tempfile.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
