[package]
name = "atlas-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "atlas-gateway"
path = "src/main.rs"

[dependencies]
atlas-common = { workspace = true }
atlas-api-types = { workspace = true }
atlas-driver-core = { workspace = true }
atlas-driver-ceph = { workspace = true }
atlas-driver-nfs = { workspace = true }
atlas-driver-zfs = { workspace = true }
atlas-driver-longhorn = { workspace = true }
atlas-driver-k8s = { workspace = true }
atlas-driver-rgw = { workspace = true }
atlas-policy = { workspace = true }
atlas-inventory = { workspace = true }
atlas-discovery = { workspace = true }
atlas-monitor = { workspace = true }
atlas-jobs = { workspace = true }
atlas-databridge = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
openidconnect = { workspace = true }
reqwest = { workspace = true }
kube = { workspace = true }
base64 = { workspace = true }
sha2 = "0.11"
uuid = { workspace = true }
# tonic 0.14 split its old single "tls" feature into per-crypto-provider ones — "tls-ring" to
# match the `ring` provider this process installs as the process-wide rustls default (main.rs);
# picking a different provider here would risk two providers fighting over install_default().
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-reflection = "0.14"
# The prost codec (ProstCodec) that tonic-prost-build's generated service code references — split
# out of tonic itself in 0.14, so it's a separate runtime dependency now.
tonic-prost = "0.14"
prost = "0.14"
async-stream = "0.3"
tokio-stream = "0.1"
rmcp = { version = "3.5", optional = true, default-features = false, features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = { version = "1", optional = true }

[features]
default = []
# Exposes Atlas's read-only inventory/advisor surface as an MCP server (see crates/atlas-gateway/src/mcp.rs).
# Default-off: mirrors the atlas-databridge optional-connector precedent — an extra authenticated
# protocol surface + dependency chain (rmcp-macros/schemars) that not every deployment wants compiled in.
mcp = ["dep:rmcp", "dep:schemars"]

# tonic-build 0.14 split its prost-specific codegen (configure()/compile_protos()) out into this
# separate crate — plain tonic-build now only generates service stubs generically.
[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
reqwest = { workspace = true }
atlas-common = { workspace = true }
atlas-inventory = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
# rmcp's `transport-streamable-http-client-reqwest` feature needs reqwest 0.13, which is now also
# this workspace's own `reqwest` version — no separate aliased dependency needed anymore (dropped
# the old `reqwest-mcp-client = { package = "reqwest", version = "0.13" }` alias that existed only
# because the workspace default used to be reqwest 0.12).
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
