//
// The part of the Container Storage Interface v1 (CSI spec v1.11.0,
// github.com/container-storage-interface/spec, Apache-2.0) that atlas-native-csi serves:
// same package, services, messages and field numbers, so it is wire-compatible with the
// Kubernetes sidecars and kubelet. RPCs and fields left out are ones the driver doesn't
// advertise (the server answers UNIMPLEMENTED) or doesn't read (unknown fields are skipped).
// google.protobuf.BoolValue and Timestamp are replaced by the local BoolValue and Timestamp,
// identical on the wire, so the build needs no well-known-type includes.

syntax = "proto3";
package csi.v1;

message BoolValue {
  bool value = 1;
}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

service Identity {
  rpc GetPluginInfo(GetPluginInfoRequest) returns (GetPluginInfoResponse) {}
  rpc GetPluginCapabilities(GetPluginCapabilitiesRequest) returns (GetPluginCapabilitiesResponse) {}
  rpc Probe(ProbeRequest) returns (ProbeResponse) {}
}

service Controller {
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse) {}
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse) {}
  rpc ValidateVolumeCapabilities(ValidateVolumeCapabilitiesRequest)
      returns (ValidateVolumeCapabilitiesResponse) {}
  rpc ControllerGetCapabilities(ControllerGetCapabilitiesRequest)
      returns (ControllerGetCapabilitiesResponse) {}
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse) {}
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse) {}
  rpc ControllerExpandVolume(ControllerExpandVolumeRequest)
      returns (ControllerExpandVolumeResponse) {}
}

service Node {
  rpc NodePublishVolume(NodePublishVolumeRequest) returns (NodePublishVolumeResponse) {}
  rpc NodeUnpublishVolume(NodeUnpublishVolumeRequest) returns (NodeUnpublishVolumeResponse) {}
  rpc NodeGetVolumeStats(NodeGetVolumeStatsRequest) returns (NodeGetVolumeStatsResponse) {}
  rpc NodeGetCapabilities(NodeGetCapabilitiesRequest) returns (NodeGetCapabilitiesResponse) {}
  rpc NodeGetInfo(NodeGetInfoRequest) returns (NodeGetInfoResponse) {}
}

message GetPluginInfoRequest {}

message GetPluginInfoResponse {
  string name = 1;
  string vendor_version = 2;
  map<string, string> manifest = 3;
}

message GetPluginCapabilitiesRequest {}

message GetPluginCapabilitiesResponse {
  repeated PluginCapability capabilities = 1;
}

message PluginCapability {
  message Service {
    enum Type {
      UNKNOWN = 0;
      CONTROLLER_SERVICE = 1;
      VOLUME_ACCESSIBILITY_CONSTRAINTS = 2;
      GROUP_CONTROLLER_SERVICE = 3;
    }
    Type type = 1;
  }
  message VolumeExpansion {
    enum Type {
      UNKNOWN = 0;
      ONLINE = 1;
      OFFLINE = 2;
    }
    Type type = 1;
  }
  oneof type {
    Service service = 1;
    VolumeExpansion volume_expansion = 2;
  }
}

message ProbeRequest {}

message ProbeResponse {
  BoolValue ready = 1;
}

message CreateVolumeRequest {
  string name = 1;
  CapacityRange capacity_range = 2;
  repeated VolumeCapability volume_capabilities = 3;
  map<string, string> parameters = 4;
  map<string, string> secrets = 5;
  VolumeContentSource volume_content_source = 6;
}

message VolumeContentSource {
  message SnapshotSource {
    string snapshot_id = 1;
  }
  message VolumeSource {
    string volume_id = 1;
  }
  oneof type {
    SnapshotSource snapshot = 1;
    VolumeSource volume = 2;
  }
}

message CreateVolumeResponse {
  Volume volume = 1;
}

message VolumeCapability {
  message BlockVolume {}
  message MountVolume {
    string fs_type = 1;
    repeated string mount_flags = 2;
    string volume_mount_group = 3;
  }
  message AccessMode {
    enum Mode {
      UNKNOWN = 0;
      SINGLE_NODE_WRITER = 1;
      SINGLE_NODE_READER_ONLY = 2;
      MULTI_NODE_READER_ONLY = 3;
      MULTI_NODE_SINGLE_WRITER = 4;
      MULTI_NODE_MULTI_WRITER = 5;
      SINGLE_NODE_SINGLE_WRITER = 6;
      SINGLE_NODE_MULTI_WRITER = 7;
    }
    Mode mode = 1;
  }
  oneof access_type {
    BlockVolume block = 1;
    MountVolume mount = 2;
  }
  AccessMode access_mode = 3;
}

message CapacityRange {
  int64 required_bytes = 1;
  int64 limit_bytes = 2;
}

message Volume {
  int64 capacity_bytes = 1;
  string volume_id = 2;
  map<string, string> volume_context = 3;
  VolumeContentSource content_source = 4;
}

message DeleteVolumeRequest {
  string volume_id = 1;
  map<string, string> secrets = 2;
}

message DeleteVolumeResponse {}

message ValidateVolumeCapabilitiesRequest {
  string volume_id = 1;
  map<string, string> volume_context = 2;
  repeated VolumeCapability volume_capabilities = 3;
  map<string, string> parameters = 4;
  map<string, string> secrets = 5;
}

message ValidateVolumeCapabilitiesResponse {
  message Confirmed {
    map<string, string> volume_context = 1;
    repeated VolumeCapability volume_capabilities = 2;
    map<string, string> parameters = 3;
  }
  Confirmed confirmed = 1;
  string message = 2;
}

message ControllerGetCapabilitiesRequest {}

message ControllerGetCapabilitiesResponse {
  repeated ControllerServiceCapability capabilities = 1;
}

message ControllerServiceCapability {
  message RPC {
    enum Type {
      UNKNOWN = 0;
      CREATE_DELETE_VOLUME = 1;
      PUBLISH_UNPUBLISH_VOLUME = 2;
      LIST_VOLUMES = 3;
      GET_CAPACITY = 4;
      CREATE_DELETE_SNAPSHOT = 5;
      LIST_SNAPSHOTS = 6;
      CLONE_VOLUME = 7;
      PUBLISH_READONLY = 8;
      EXPAND_VOLUME = 9;
    }
    Type type = 1;
  }
  oneof type {
    RPC rpc = 1;
  }
}

message CreateSnapshotRequest {
  string source_volume_id = 1;
  string name = 2;
  map<string, string> secrets = 3;
  map<string, string> parameters = 4;
}

message CreateSnapshotResponse {
  Snapshot snapshot = 1;
}

message Snapshot {
  int64 size_bytes = 1;
  string snapshot_id = 2;
  string source_volume_id = 3;
  Timestamp creation_time = 4;
  bool ready_to_use = 5;
}

message DeleteSnapshotRequest {
  string snapshot_id = 1;
  map<string, string> secrets = 2;
}

message DeleteSnapshotResponse {}

message ControllerExpandVolumeRequest {
  string volume_id = 1;
  CapacityRange capacity_range = 2;
  map<string, string> secrets = 3;
  VolumeCapability volume_capability = 4;
}

message ControllerExpandVolumeResponse {
  int64 capacity_bytes = 1;
  bool node_expansion_required = 2;
}

message NodePublishVolumeRequest {
  string volume_id = 1;
  map<string, string> publish_context = 2;
  string staging_target_path = 3;
  string target_path = 4;
  VolumeCapability volume_capability = 5;
  bool readonly = 6;
  map<string, string> secrets = 7;
  map<string, string> volume_context = 8;
}

message NodePublishVolumeResponse {}

message NodeUnpublishVolumeRequest {
  string volume_id = 1;
  string target_path = 2;
}

message NodeUnpublishVolumeResponse {}

message NodeGetVolumeStatsRequest {
  string volume_id = 1;
  string volume_path = 2;
  string staging_target_path = 3;
}

message NodeGetVolumeStatsResponse {
  repeated VolumeUsage usage = 1;
  VolumeCondition volume_condition = 2;
}

message VolumeUsage {
  enum Unit {
    UNKNOWN = 0;
    BYTES = 1;
    INODES = 2;
  }
  int64 available = 1;
  int64 total = 2;
  int64 used = 3;
  Unit unit = 4;
}

message VolumeCondition {
  bool abnormal = 1;
  string message = 2;
}

message NodeGetCapabilitiesRequest {}

message NodeGetCapabilitiesResponse {
  repeated NodeServiceCapability capabilities = 1;
}

message NodeServiceCapability {
  message RPC {
    enum Type {
      UNKNOWN = 0;
      STAGE_UNSTAGE_VOLUME = 1;
      GET_VOLUME_STATS = 2;
      EXPAND_VOLUME = 3;
      VOLUME_CONDITION = 4;
    }
    Type type = 1;
  }
  oneof type {
    RPC rpc = 1;
  }
}

message NodeGetInfoRequest {}

message NodeGetInfoResponse {
  string node_id = 1;
  int64 max_volumes_per_node = 2;
}
