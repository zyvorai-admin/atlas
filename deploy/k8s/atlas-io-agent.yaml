# Optional node sensor. Default is fake so a lab cluster can exercise the API without CAP_BPF.
# Live mode (block-layer BPF, docs/IO_EBPF.md): set --mode/ATLAS_IO_MODE to live and give the
# container, instead of privileged:
#   securityContext:
#     runAsUser: 0
#     seccompProfile: { type: Unconfined }   # RuntimeDefault blocks perf_event_open without SYS_ADMIN
#     capabilities: { drop: [ALL], add: [BPF, PERFMON] }
#   volumeMounts: [{ name: tracefs, mountPath: /sys/kernel/tracing, readOnly: true }]
#   volumes:      [{ name: tracefs, hostPath: { path: /sys/kernel/tracing } }]
# Without them the agent still serves, reporting the programs missing.
# The Atlas Native view (/io/native) also needs hostPID: true (it matches host tgids), and to pin
# its maps the host bpffs mounted outside /sys (RuntimeDefault AppArmor refuses writes there):
#   volumeMounts: [{ name: bpffs, mountPath: /host-bpf }]
#   volumes:      [{ name: bpffs, hostPath: { path: /sys/fs/bpf } }]
#   env:          [{ name: ATLAS_IO_NATIVE_PIN_DIR, value: /host-bpf/atlas/native }]
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: atlas-io-agent
  namespace: zyvor-system
  labels:
    app.kubernetes.io/name: atlas-io-agent
    app.kubernetes.io/part-of: atlas
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-io-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-io-agent
    spec:
      hostPID: false
      containers:
        - name: agent
          image: ghcr.io/zyvorai/atlas-io-agent:0.5.0
          imagePullPolicy: IfNotPresent
          args: ["--bind", "0.0.0.0:5111", "--mode", "fake"]
          env:
            - name: ATLAS_IO_MODE
              value: "fake"
          ports:
            - name: http
              containerPort: 5111
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-io-agent
  namespace: zyvor-system
spec:
  selector:
    app.kubernetes.io/name: atlas-io-agent
  ports:
    - name: http
      port: 5111
      targetPort: 5111
