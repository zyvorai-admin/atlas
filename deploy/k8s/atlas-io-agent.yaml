# Optional node sensor. Privileged + host /sys/fs/bpf only when ATLAS_IO_MODE=live.
# Default is fake so a lab cluster can exercise the API without CAP_BPF.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: atlas-io-agent
  namespace: zyvor-system
  labels:
    app.kubernetes.io/name: atlas-io-agent
    app.kubernetes.io/part-of: atlas
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-io-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-io-agent
    spec:
      hostPID: false
      containers:
        - name: agent
          image: ghcr.io/zyvorai/atlas-io-agent:0.4.0
          imagePullPolicy: IfNotPresent
          args: ["--bind", "0.0.0.0:5111", "--mode", "fake"]
          env:
            - name: ATLAS_IO_MODE
              value: "fake"
          ports:
            - name: http
              containerPort: 5111
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-io-agent
  namespace: zyvor-system
spec:
  selector:
    app.kubernetes.io/name: atlas-io-agent
  ports:
    - name: http
      port: 5111
      targetPort: 5111
