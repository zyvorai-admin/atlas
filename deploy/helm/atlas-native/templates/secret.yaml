{{- if not .Values.apiToken.existingSecret }}
{{- /* Reuse the live token across upgrades; `helm template` cannot `lookup` and renders a throwaway. */}}
{{- $name := include "atlas-native.tokenSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "token") }}
{{- $token = index $existing.data "token" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atlas-native.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  token: {{ default (randAlphaNum 48) $token | quote }}
{{- end }}
