version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/crates/atlas-gateway/ui"
    schedule:
      interval: weekly
    groups:
      ui-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "ui"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    groups:
      website-dependencies:
        patterns: ["*"]
    labels: ["dependencies", "docs"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # codeql-action init/autobuild/analyze must move in lockstep (see codeql.yml).
      codeql-action:
        patterns: ["github/codeql-action*"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: "/deploy/databridge/connect"
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
