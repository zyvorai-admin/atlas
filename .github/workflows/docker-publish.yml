#
# Publishes container images on a tagged release. Every push/PR already build-tests both
# Dockerfiles in ci.yml's `docker` job (push: false) — this workflow only fires on `v*` tags
# (or manual dispatch) and is the one place images actually get pushed, signed, and scanned.
name: Publish container images

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # anchore/sbom-action attaches the SBOM to the tag's GitHub Release
      packages: write
      id-token: write # keyless cosign signing
      security-events: write # Trivy SARIF upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image: ghcr.io/zyvorai/atlas
            name: atlas
          - dockerfile: Dockerfile.ceph
            image: ghcr.io/zyvorai/atlas-ceph
            name: atlas-ceph
          - dockerfile: Dockerfile.io
            image: ghcr.io/zyvorai/atlas-io-agent
            name: atlas-io-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ steps.ver.outputs.version }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing via this run's own OIDC token — no signing key/secret to manage.
      - name: Sign image (keyless)
        run: cosign sign --yes "${{ matrix.image }}@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: "${{ matrix.image }}:${{ steps.ver.outputs.version }}"
          format: cyclonedx-json
          output-file: "sbom-${{ matrix.name }}.cdx.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.name }}
          path: "sbom-*.cdx.json"
          retention-days: 90

      # Informational until a baseline is established, same posture as ci.yml's fmt check.
      # if: always() so an unrelated earlier-step failure (e.g. the SBOM upload) can't silently
      # skip this and leave the next step uploading a SARIF file that was never produced.
      - name: Scan image (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: "${{ matrix.image }}:${{ steps.ver.outputs.version }}"
          format: sarif
          output: trivy-results.sarif

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: "trivy-${{ matrix.dockerfile }}"
